<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Link Streamz Admin</title>
<style>
:root{--o:#FF6600;--o2:#FF8A33;--card:#0F0F0F;--row:#151515;--line:rgba(255,102,0,.16);--line2:rgba(255,102,0,.4);--tx:#F4E9DF;--mut:#8F7F71;--faint:#5E4C3E;--g:#3DDC84;--y:#FFB020;--r:#FF4D4D;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(80% 36% at 62% 0,rgba(255,102,0,.13),transparent 70%),#000;color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.sb{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 18px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(160deg,var(--o2),var(--o));display:grid;place-items:center;color:#000;box-shadow:0 4px 14px rgba(255,102,0,.35);flex:none}
.brand b{display:block;letter-spacing:.04em;font-size:14px}
.brand small{color:var(--mut);font-size:12px}
#nav{display:grid;gap:4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid transparent;border-radius:12px;background:none;text-align:left;color:#B39A86}
.nav:hover{background:rgba(255,102,0,.07)}
.nav.on{background:rgba(255,102,0,.13);border-color:var(--line2);color:var(--tx);font-weight:600}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav.on svg{stroke:var(--o)}
.nav em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:12px;color:var(--faint)}
.repo{margin-top:auto;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px}
.repo b{display:flex;align-items:center;gap:8px;font-size:13px}
.repo small{display:block;color:var(--mut);font-family:var(--mono);font-size:11.5px;margin-top:4px;word-break:break-all}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.g{background:var(--g);box-shadow:0 0 8px rgba(61,220,132,.7)}.y{background:var(--y);box-shadow:0 0 8px rgba(255,176,32,.6)}.r{background:var(--r);box-shadow:0 0 8px rgba(255,77,77,.6)}
.main{padding:22px 28px 60px;min-width:0;max-width:1320px;width:100%;margin:0 auto}
.mb{display:none;align-items:center;gap:10px;margin-bottom:14px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top>div:first-child{flex:1 1 220px;min-width:0}
.top h1{margin:0;font-size:22px}
.sub{color:var(--mut);font-size:13px;margin:2px 0 0}
.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:700;background:linear-gradient(180deg,var(--o2),var(--o));color:#000;box-shadow:0 5px 16px rgba(255,102,0,.28)}
.btn:hover{filter:brightness(1.08)}
.btn.gh{background:transparent;color:var(--o);border:1px solid rgba(255,102,0,.6);box-shadow:none}
.btn.gh:hover{background:rgba(255,102,0,.12)}
.btn.rd{background:transparent;color:var(--r);border:1px solid rgba(255,77,77,.5);box-shadow:none}
.btn.dn{background:var(--r);color:#000;box-shadow:0 5px 16px rgba(255,77,77,.28)}
.pill{border:1px solid var(--line2);background:rgba(255,102,0,.1);color:var(--o);border-radius:20px;padding:7px 13px;font-weight:600;display:flex;align-items:center;gap:8px}
.pill.clean{color:var(--mut);background:none;border-color:var(--line)}
input,select{background:#000;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;width:100%;outline:none;min-width:0}
select{background:#0A0A0A}
input:focus,select:focus{border-color:var(--o);box-shadow:0 0 0 3px rgba(255,102,0,.15)}
input::placeholder{color:var(--faint)}
.mono{font-family:var(--mono);font-size:12.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{border:1px solid rgba(255,102,0,.28);background:#0A0A0A;color:#B39A86;border-radius:18px;padding:7px 14px}
.chip i{font-style:normal;color:#7A6656;margin-left:6px;font-size:12.5px}
.chip.on{background:linear-gradient(180deg,var(--o2),var(--o));color:#000;border-color:var(--o);font-weight:700}
.chip.on i{color:#000;opacity:.7}
.search{margin-left:auto;max-width:260px;flex:1 1 180px}
.tbl{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow-x:auto}
.tr{display:grid;gap:14px;align-items:center;padding:12px 16px}
.tbl>.tr{border-top:1px solid var(--line)}
.tbl>.tr:first-child{border-top:none}
.th{color:var(--mut);font-size:12.5px}
.ev{grid-template-columns:140px 1.1fr 1.7fr 130px 84px}
.hl{grid-template-columns:1.3fr 1.6fr 80px 130px 84px}
.tr.click:hover{background:rgba(255,102,0,.05)}
.st{display:flex;align-items:center;gap:8px;font-weight:600}
.mn{color:var(--o);font-weight:600}
.pd{width:10px;height:10px;border-radius:50%;background:var(--o);box-shadow:0 0 8px rgba(255,102,0,.9);animation:p 1.6s infinite;flex:none}
.pd.ring{background:none;border:2px solid var(--o);box-shadow:none;animation:none}
.pd.off{background:var(--faint);box-shadow:none;animation:none}
@keyframes p{50%{opacity:.5}}
@media(prefers-reduced-motion:reduce){.pd{animation:none}*{transition:none!important}}
.lg{color:#E3D3C4;font-size:13px;min-width:0}
.lg small{display:block;color:var(--mut);font-size:12px}
.m{display:flex;align-items:center;gap:9px;font-weight:600;min-width:0;flex-wrap:wrap}
.m span{overflow:hidden;text-overflow:ellipsis}
.bd{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;font-size:9.5px;font-weight:800;color:var(--tx);background:#1A1108;border:1px solid var(--line2);box-shadow:0 2px 6px rgba(0,0,0,.6)}
.bd img{width:100%;height:100%;object-fit:cover;display:block}
.svs{display:flex;align-items:center;gap:5px;color:var(--mut);font-size:13px;flex-wrap:wrap}
.svs .dot{width:8px;height:8px}
.acts{display:flex;gap:6px;justify-content:flex-end}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:#0A0A0A;color:var(--o);display:grid;place-items:center;font-size:15px;line-height:1;flex:none}
.ib:hover{background:rgba(255,102,0,.14)}
.ib.x{color:var(--r);border-color:rgba(255,77,77,.35)}
.empty{padding:34px;text-align:center;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tc{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;display:grid;gap:12px}
.tc .bd{width:48px;height:48px;font-size:13px}
.r2{display:flex;gap:12px;align-items:flex-end}
.lab{font-size:12.5px;color:var(--mut);margin:0 0 5px;display:block}
.panel{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:16px}
.ft{display:grid;grid-template-columns:90px 1fr 1.6fr auto;gap:10px;align-items:end;margin-top:12px}
.chg{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.chg li{display:flex;gap:9px;align-items:center;background:var(--row);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.chg li::before{content:"+";color:var(--o);font-weight:800}
pre{margin:0;background:#000;border:1px solid var(--line);border-radius:12px;padding:14px;max-height:320px;overflow:auto;font:12px/1.5 var(--mono);color:#E3D3C4}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--card);border-left:1px solid var(--line2);box-shadow:-20px 0 60px rgba(255,102,0,.10);transform:translateX(102%);transition:transform .25s;z-index:6;display:flex;flex-direction:column}
.dr.on{transform:none}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dh h2{margin:0;font-size:17px;margin-right:auto}
.db{padding:18px 20px;overflow:auto;flex:1;display:grid;gap:16px;align-content:start}
.df{padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:#0A0A0A;border:1px solid var(--line);border-radius:16px;padding:9px 11px 11px}
.pc .l{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:#E3D3C4;line-height:14px}
.pc .mt{display:flex;align-items:center;margin-top:11px}
.pc .tm{flex:1;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0}
.pc .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .tm.r2{justify-content:flex-end}
.pc .bd{width:36px;height:36px;font-size:11px}
.pc .c{width:70px;text-align:center;color:var(--o);font-weight:500;font-size:15px;flex:none}
.pc .c small{display:block;font-family:var(--mono);font-size:10px}
.tri{width:0;height:0;border-left:9px solid var(--o);border-top:5.5px solid transparent;border-bottom:5.5px solid transparent;flex:none}
.pl2{font-family:var(--mono);font-size:12px;color:var(--o);background:rgba(255,102,0,.14);border:1px solid var(--line2);border-radius:8px;padding:2px 8px;text-transform:none}
.play{width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,var(--o2),var(--o));display:grid;place-items:center;margin:auto}
.play::after{content:"";border-left:11px solid #000;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.sv{border:1px solid var(--line);background:var(--row);border-radius:14px;padding:12px;display:grid;gap:10px}
.sv.rec{border-color:rgba(255,102,0,.5);background:linear-gradient(90deg,rgba(255,102,0,.12),rgba(255,102,0,.02) 70%),var(--row)}
.sr{display:grid;grid-template-columns:auto 1fr 84px auto;gap:8px;align-items:center}
.rc{display:flex;align-items:center;gap:6px;font-size:13px;color:#B39A86;white-space:nowrap}
.rc input{width:auto;accent-color:var(--o)}
.cf{position:fixed;inset:0;z-index:8;display:none;place-items:center;padding:16px;background:rgba(0,0,0,.82)}
.cf.on{display:grid}
.cfb{background:var(--card);border:1px solid rgba(255,77,77,.45);border-radius:22px;padding:22px;max-width:420px;width:100%;box-shadow:0 0 0 4px rgba(255,77,77,.06),0 20px 60px rgba(0,0,0,.8)}
.cfi{width:44px;height:44px;border-radius:14px;background:rgba(255,77,77,.14);border:1px solid rgba(255,77,77,.4);color:var(--r);display:grid;place-items:center;font-size:22px;font-weight:800;margin-bottom:12px}
.cfb h2{margin:0 0 8px;font-size:18px}
.cfb p{margin:0 0 18px;color:#C9B8A8;line-height:1.5}
.cfb p b{color:var(--tx)}
.cfa{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;transition:.25s;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:12px 18px;z-index:9;box-shadow:0 10px 40px rgba(255,102,0,.2);display:flex;gap:10px;align-items:center;max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.tpb{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:6px 11px;background:#000;border:1px solid var(--line2);border-radius:10px;text-align:left}
.tpb:hover{border-color:var(--o)}
.tpb .bd{width:26px;height:26px;font-size:8.5px}
.tpb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpb::after{content:"\25BE";color:var(--o);font-size:13px}
.tp{position:fixed;inset:0;z-index:7;display:none;place-items:center;padding:16px;background:rgba(0,0,0,.8)}
.tp.on{display:grid}
.tpc{background:var(--card);border:1px solid var(--line2);border-radius:22px;width:min(440px,100%);height:min(560px,86vh);height:min(560px,86dvh);display:flex;flex-direction:column;padding:16px;gap:12px;box-shadow:0 0 0 4px rgba(255,102,0,.05),0 20px 60px rgba(0,0,0,.8)}
.tph{display:flex;align-items:center;gap:10px}
.tph b{font-size:16px;flex:1}
.tph small{color:var(--mut);font-size:12.5px}
#tpl,#opl{flex:1;overflow:auto;display:grid;gap:6px;align-content:start;margin:0 -4px;padding:0 4px}
.tpr{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;border-radius:12px;background:var(--row);border:1px solid var(--line);text-align:left}
.tpr .bd{width:34px;height:34px;font-size:10px}
.tpr .n{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpr .cd{color:var(--mut)}
.tpr .ck{color:var(--o);font-weight:800}
.tpr:hover:not(:disabled),.tpr.act{border-color:var(--o);background:rgba(255,102,0,.10)}
.tpr.sel{border-color:rgba(255,102,0,.55)}
.tpr:disabled{opacity:.4;cursor:not-allowed}
.tpr.add{border-style:dashed;border-color:rgba(255,102,0,.6)}
.tpr.add .n{color:var(--o)}
.tpg{color:var(--mut);font-size:12px;padding:8px 4px 2px}
.tpn{display:grid;gap:10px;padding:14px;border:1px dashed var(--line2);border-radius:14px}
.tpn p{margin:0;color:#C9B8A8}
.tpb.tk::after{content:"\25F7";font-size:17px}
.tpb:disabled{opacity:.5;cursor:not-allowed}
.tpc.tmc{height:auto;max-height:92vh;max-height:92dvh;overflow:auto}
.whs{display:flex;gap:10px;justify-content:center}
.wc{flex:1;min-width:0;max-width:150px;text-align:center}
.ww{position:relative;height:200px;border-radius:14px;background:#0A0A0A;border:1px solid var(--line);overflow:hidden}
.ww::before,.ww::after{content:"";position:absolute;left:0;right:0;height:70px;z-index:2;pointer-events:none}
.ww::before{top:0;background:linear-gradient(#0A0A0A,transparent)}
.ww::after{bottom:0;background:linear-gradient(transparent,#0A0A0A)}
.wb{position:absolute;left:6px;right:6px;top:80px;height:40px;border:1px solid var(--o);border-radius:10px;background:rgba(255,102,0,.10);z-index:0}
.wh{position:relative;z-index:1;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;outline:none}
.wh::-webkit-scrollbar{display:none}
.wh:focus-visible{outline:2px solid var(--o);outline-offset:-2px}
.wp{height:80px}
.wi{height:40px;scroll-snap-align:center;display:grid;place-items:center;font-size:16px;color:#7A6656;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.wi.on{color:var(--tx);font-weight:700;font-size:18px}
.tsum{text-align:center;padding:10px;border-radius:12px;background:rgba(255,102,0,.08);border:1px solid var(--line2);font-weight:600}
.tsum small{display:block;color:var(--mut);font-weight:400;margin-top:2px}
.adv{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:12px}
.adv summary{cursor:pointer;color:#B39A86;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
.adv summary::-webkit-details-marker{display:none}
.adv summary::before{content:"\25B8";color:var(--o);transition:transform .15s}
.adv[open] summary::before{transform:rotate(90deg)}
.adv summary .pl2{font-size:11px}
.hr{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px;align-items:center}
.chip.mini{padding:5px 10px;font-size:12.5px}
.warn{display:grid;gap:2px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,176,32,.5);background:rgba(255,176,32,.08);margin-bottom:16px}
.warn b{color:var(--y)}.warn span{color:#C9B8A8;font-size:13px}
.warn.bad{border-color:rgba(255,77,77,.55);background:rgba(255,77,77,.08)}.warn.bad b{color:var(--r)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,102,0,.3);border-top-color:var(--o);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
@media(max-width:600px){.tp{place-items:end center;padding:0}.tpc{width:100%;height:88vh;height:88dvh;border-radius:22px 22px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom))}}
@media(max-width:860px){
 .app{display:block}
 .sb{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(0,0,0,.94);backdrop-filter:blur(10px);border-right:none;border-top:1px solid var(--line2);z-index:4;gap:0}
 .sb .brand,.repo{display:none}
 #nav{display:flex;width:100%;gap:4px}
 .nav{flex:1;flex-direction:column;gap:3px;padding:7px 4px;font-size:11.5px;text-align:center;justify-content:center}
 .nav em{display:none}
 .main{padding:16px 14px 100px}
 .mb{display:flex}
 .toast{bottom:88px}
}
@media(max-width:760px){
 .tbl{border:none;background:none;overflow:visible}
 .th{display:none}
 .tbl>.tr,.tbl>.tr:first-child{border:1px solid var(--line);background:var(--card);border-radius:16px;margin-bottom:10px;grid-template-columns:1fr auto;gap:10px 12px}
 .ev{grid-template-areas:"lg st" "m m" "sv ac"}
 .hl{grid-template-areas:"t ac" "m m" "d sv"}
 .a-st{grid-area:st;justify-self:end}.a-lg{grid-area:lg}.a-m{grid-area:m}.a-sv{grid-area:sv}.a-ac{grid-area:ac}.a-t{grid-area:t}.a-d{grid-area:d}
 .ft{grid-template-columns:1fr}
 .search{max-width:none;flex-basis:100%;margin-left:0;order:9}
}
@media(max-width:480px){.f2{grid-template-columns:1fr}.top h1{font-size:20px}.dh,.db,.df{padding-left:14px;padding-right:14px}.df .btn{flex:1}}
</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="#000"><path d="M7 4l13 8-13 8z"/></svg></div><div><b>LINK STREAMZ</b><small>Admin console</small></div></div>
    <div id="nav"></div>
    <div class="repo"><b id="repoStatus"><span class="dot g"></span>Connected to GitHub</b><small id="repoName">Loading...</small></div>
  </aside>
  <main class="main">
    <div class="mb"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="#000"><path d="M7 4l13 8-13 8z"/></svg></div><div><b style="letter-spacing:.04em">LINK STREAMZ</b><div class="sub" style="margin:0">Admin console</div></div></div>
    <div class="top"><div><h1 id="ttl"></h1><p class="sub" id="sub"></p></div><button class="pill" id="pill" onclick="go('publish')"></button><button class="btn" onclick="go('publish')">Publish</button></div>
    <div id="view"></div>
  </main>
</div>
<div class="ov" id="ov" onclick="closeEd()"></div>
<aside class="dr" id="dr" aria-label="Editor"></aside>

let ghToken = localStorage.getItem('ls_gh_token') || '';

function saveCfg(k, v) {
  if (k === 'user') { ghUser = v.trim(); localStorage.setItem('ls_gh_user', ghUser); }
  if (k === 'repo') { ghRepo = v.trim(); localStorage.setItem('ls_gh_repo', ghRepo); }
  if (k === 'token') { ghToken = v.trim(); localStorage.setItem('ls_gh_token', ghToken); }
  updateRepoBadge();
  render();
}

function updateRepoBadge() {
  const nameEl = $('#repoName');

    nameEl.textContent = `${ghUser}/${ghRepo}`;
    statusEl.innerHTML = '<span class="dot g"></span>Connected to GitHub';
  } else if (ghUser && ghRepo) {
    nameEl.textContent = `${ghUser}/${ghRepo}`;
    statusEl.innerHTML = '<span class="dot y"></span>Missing token';
  } else {
    nameEl.textContent = 'Not configured';
    statusEl.innerHTML = '<span class="dot r"></span>No repo set';
  }
}
